name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL=https://api.andreiabiscuit.apnet.tech/api npm run build

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/root/apnet/andreiabiscuit/frontend"
          strip_components: 2

      - name: Upload server.cjs para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/server.cjs"
          target: "/root/apnet/andreiabiscuit/frontend"
          strip_components: 1

      - name: Migrar PM2 para server.cjs se necessário
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if pm2 info frontend_andreia 2>/dev/null | grep -q 'server.cjs'; then
              pm2 restart frontend_andreia
            else
              pm2 stop frontend_andreia 2>/dev/null || true
              pm2 delete frontend_andreia 2>/dev/null || true
              pm2 start /root/apnet/andreiabiscuit/frontend/server.cjs --name frontend_andreia
              pm2 save
            fi

      - name: Gerar bundle OTA
        run: |
          BUNDLE_ID=$(echo $GITHUB_SHA | cut -c1-8)
          cd frontend/dist && zip -r ../../bundle-${BUNDLE_ID}.zip .

      - name: Upload bundle OTA para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "bundle-*.zip"
          target: "/root/apnet/andreiabiscuit/updates/bundles"

      - name: Atualizar latest.json no VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BUNDLE_ID=$(echo ${{ github.sha }} | cut -c1-8)
            BUNDLE_URL="https://api.andreiabiscuit.apnet.tech/updates/bundles/bundle-${BUNDLE_ID}.zip"
            echo "{\"bundleId\":\"${BUNDLE_ID}\",\"url\":\"${BUNDLE_URL}\"}" > /root/apnet/andreiabiscuit/updates/latest.json
